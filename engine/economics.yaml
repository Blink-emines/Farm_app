# Generated from the FAOSTAT bulk files on 2026-11-14 (not hand-typed). Every number has a source and year.
status: editable default (FAOSTAT national values, Morocco); the farmer may override any value
currency: MAD
sources:
  prices:
    name: FAOSTAT Producer Prices (domain PP)
    element: Producer Price (LCU/tonne)
    unit: MAD per tonne
    url: https://bulks-faostat.fao.org/production/Prices_E_All_Data_(Normalized).zip
    accessed: '2026-11-14'
    default_year: 2024
  yields:
    name: FAOSTAT Crops and livestock products (domain QCL)
    element: Yield
    unit: kg/ha converted to t/ha
    url: https://bulks-faostat.fao.org/production/Production_Crops_Livestock_E_All_Data_(Normalized).zip
    accessed: '2026-11-14'
    years: 2015-2024
notes:
- National averages, not specific to the Saiss or to rainfed fields.
- 'No Moroccan cost-of-production per hectare source was found: costs stay unknown, so profit is shown only when the farmer enters costs.'
- olive_intercrop revenue is the olive crop only; the intercrop under the trees is not included.
