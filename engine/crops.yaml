# Crop parameters. Every value has a source. Never invent numbers:
# anything not verified is the string "unknown, needs local data" (an information gap).
# FAO-56 = FAO Irrigation and Drainage Paper 56 (Allen et al. 1998), Chapter 6 Tables 11/12, Chapter 8 Table 22.
# Months: "default approved by user 2026-11-14, to confirm locally"; request months override.
# income_flag/forage_flag: qualitative, no price data, always low confidence.
crops:
