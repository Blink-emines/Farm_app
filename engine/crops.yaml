    family: {value: poaceae, source: "botanical taxonomy"}
    legume: {value: false, source: "botanical taxonomy"}
    cereal: {value: true, source: "botanical taxonomy"}
    perennial: {value: false, source: "botanical taxonomy"}
    cover: {value: false, source: "classification"}
    rooting_zr_min_m: {value: 1.0, source: "FAO-56 Table 22, Spring Wheat 1.0-1.5 m (Winter Wheat row is 1.5-1.8 m; deep either way)"}
    kc_ini: {value: "unknown, needs local data", source: "FAO-56 Table 12 Kc ini column not readable in the fetched text"}
    kc_mid: {value: 1.15, source: "FAO-56 Table 12, Wheat"}
    kc_end: {value: "0.25-0.4", source: "FAO-56 Table 12, Wheat (printed as a range)"}
    stage_lengths_days: {value: "unknown, needs local data", source: "FAO-56 Table 11 gives regional examples only"}
    sow_month: {value: 11, source: "default approved by user 2026-11-14, to confirm locally", basis: "FAO-56 Table 11 winter wheat, Mediterranean: planted November, 240 days"}
